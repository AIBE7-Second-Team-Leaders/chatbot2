spring.application.name=chatbot2
server.port=${PORT:8080}

# IntelliJ에서 프로젝트 루트로 실행할 때 .env.dev의 DB_* 값을 읽는다.
# 파일이 없어도 기본 환경변수/기본값으로 계속 시작할 수 있다.
spring.config.import=optional:file:.env.dev[.properties]

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: schema is managed by the existing MySQL SQL script.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Spring AI
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.nim.api-key=${NIM_API_KEY}

spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.chat.temperature=0.7
spring.ai.openai.chat.max-tokens=1024

spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.temperature=0.7
spring.ai.google.genai.chat.max-tokens=1024

spring.ai.nim.base-url=https://integrate.api.nvidia.com/v1
spring.ai.nim.chat.model=deepseek-ai/deepseek-v4-flash

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# JSP view
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
